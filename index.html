<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sorting Visualizer</title>
    <link rel="shortcut icon" type="image/ico" href="client/styling/icon.ico"/>
    <style>
      /* Fallback styles in case CSS doesn't load */
      body {
        margin: 0;
        font-family: 'Orbitron', monospace;
        background: radial-gradient(ellipse at center, #0a0a2e 0%, #000011 30%, #000000 100%);
        color: #ffffff;
        overflow-x: hidden;
      }
      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 24px;
        color: #00bfff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">Loading Sorting Visualizer...</div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="client/public/bundle.js" type="text/javascript"></script>

</html>
